[package]
name = "libtypedtmpl"
version = "0.0.0"
edition = "2021"
publish = false
description = "A small template system over libtypedmd graphs: records, typed slots, constructs, and a collapse into HTML."

[dependencies]
# 0.2.0 (the commit tagged v0.2.0), for the whole plan.
libtypedmd = { git = "https://github.com/tmzt/libtypedmd", rev = "a61c091e6420a1dfc40e89b8600cd26e628e5f7a" }
comrak = { version = "0.59", default-features = false, optional = true }

[features]
default = ["markdown"]
markdown = ["dep:comrak"]
